# staledocs — deterministic code<->docs drift detection.
# Docs: https://github.com/Synforger/staledocs
version: 1

# warn  = report only (onboarding mode)
# strict = non-zero exit on red findings (turn on once the pairing is complete)
# C2 (10.10.2026): Paare komplett (55 + 49 standalone + README global) -> scharf.
gate: strict

source:
  include:
    - "connectors/**"
    - "deploy/**"
    - "docs/**"
    - "marketing/**"
    - "scripts/**"
    - "tests/**"
    - "webui/**"
  exclude: []

docs:
  include:
    - "**/*.md"
  exclude:
    # Test-Fixtures des Wächters `mdguard` (22.10.2026): bewusst verstoßende
    # Musterdateien — keine Doku, daher nicht klassifizierbar.
    - "tests/fixtures/md-guard/**"

# Explicit pairs (CODEOWNERS-style): a doc owns the code matched by its globs.
# Paar-Regel (Lab, 10.10.2026, C1): MD-first — die Doku beschreibt den Code,
# ein Paar = ein Wissensdokument + die Codeflächen, die es behauptet.
# Quelldateien dürfen in mehreren Paaren liegen; jedes Paar braucht >=1 Treffer.
pairs:
  # --- Projekt-Wissensbasis (Catch-All: kein Source-File ohne verantwortliche Doku)
  - doc: AGENTS.md
    code: ["connectors/**", "docs/**", "scripts/**", "tests/**", "webui/**"]
  - doc: ui/ANIMATION_ENTSCHEIDUNG.md
    code: ["webui/pages/landing.py", "webui/static/three/**", "tests/test_landing_page.py", "tests/e2e_landing_chapters.py"]
  - doc: knowledge/system/cloudflare-deployment.md
    code: ["deploy/caddy/**", "deploy/systemd/km-hr-agent.service", "webui/main.py"]
  - doc: marketing/ENTSCHEIDUNG.md
    code: ["scripts/social_agent.py", "scripts/social_oauth.py", "tests/test_social_agent.py", "tests/test_social_oauth.py", "deploy/systemd/kmhr-social.service", "deploy/systemd/kmhr-social.timer"]
  - doc: marketing/social-agent.md
    code: ["scripts/social_agent.py", "scripts/social_oauth.py", "scripts/agent-runner.py", "tests/test_social_agent.py", "tests/test_social_oauth.py"]
  - doc: marketing/ADS_ENTSCHEIDUNG.md
    code: ["scripts/ads_agent.py", "scripts/social_agent.py", "tests/test_ads_agent.py"]
  - doc: marketing/ADS_ALTERNATIVEN.md
    code: ["scripts/ads_agent.py", "tests/test_ads_channels.py"]
  - doc: marketing/ADS_INNOVATION.md
    code: ["scripts/jobs_x402_feed.py", "tests/test_jobs_x402_feed.py"]
  - doc: marketing/ads-agent.md
    code: ["scripts/ads_agent.py", "scripts/social_agent.py", "tests/test_ads_agent.py"]
  - doc: skills/social-agent/SKILL.md
    code: ["scripts/social_agent.py", "scripts/social_oauth.py", "tests/test_social_agent.py", "tests/test_social_oauth.py"]
  - doc: knowledge/system/social-automation.md
    code: ["scripts/social_agent.py", "scripts/social_oauth.py", "scripts/agent-runner.py", "tests/test_social_agent.py", "tests/test_social_oauth.py", "deploy/systemd/kmhr-social.service", "deploy/systemd/kmhr-social.timer"]
  - doc: instructions.md
    code: ["webui/**", "scripts/**"]
  - doc: knowledge.md
    code: ["knowledge/**"]
  - doc: skills/README.md
    code: ["skills/**"]
  - doc: CONTRIBUTING.md
    code: ["scripts/ci/checks.py"]

  # --- Connectoren / MCP
  - doc: connectors/README.md
