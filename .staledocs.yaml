# Whole-repo docs (README class): anchor verification only, no pair ledger.
global:
  - README.md

anchors:
  min_length: 3
  # S6 (10.10.2026): Tokens, die wie Pfade aussehen, aber KEINE Repo-Pfad-Claims
  # sind (Symbole, Modulnamen, Glob-Muster, geplante Dateien). Exact-Tokens;
  # Eintraege mit * ? [ wirken als Globs.
  ignore:
    # JSON-Felder / Python-Module / UI-Identifikatoren (keine Pfade)
    - "kontakt.email"
    - "kontakt.telefon"
    - "standort.aktuell"
    - "importlib.metadata"
    - "ui.echart"
    - "ui.footer"
    - "ui.animate"
    - "babel.cfg"                        # existiert by design nicht (knowledge/system/i18n.md)
    - "git@github.com:abatn/km-hr-agent.git"   # Git-Remote-URL
    # Glob-Muster: generierte Artefakte / Katalog-Dateien
    - "webui/locales/*/messages.po"
    - "webui/locales/*/messages.mo"
    - "webui/locales/*/messages.{po,mo}"
    - "notify_user-*.md"
    - "onboarding-freigabe-*.md"
    - "contract-preflight-*.md"
    - "*-kandidat-{id}-*.md"
    - "verify_documents-kandidat-{id}-*.md"
    # Geplante, (noch) nicht angelegte Dateien — Prosa ist korrekt (Backlog/Bauplan)
    - "tests/e2e_matching_filter.py"
    - "tests/e2e_c2_connector.py"
    - "webui/tool_catalog.py"
    - "scripts/migrate_sqlite_to_supabase.py"
    - "supabase/migrations/0001_init_schema.sql"
  include_fenced: false
  path_roots: []   # extra prefixes for resolving doc-quoted paths (e.g. [src])
  # quoted branch names (feature/dark-mode) are not paths; first segments
  # listed here skip path verification when no such tracked path exists.
  # branch_prefixes: [feature, fix, hotfix, release, chore, origin]

# Executable-docs layer (opt-in): map each fence tag to the runner that
# executes those blocks in your test suite, or to none (display-only).
# staledocs never runs anything — it inventories the blocks and flags
# unclassified tags so a forgotten wiring cannot stay silent.
# examples:
#   python: "pytest --doctest-glob='*.md'"
#   console: "byexample"
#   yaml: none
