<!doctype html><html lang="de"><body><h1>Bewerbung</h1><form id="apply">
<label for="a1">Vorname</label><input id="a1" name="vorname" data-expect="first_name" required>
<label for="a2">Nachname</label><input id="a2" name="nachname" data-expect="last_name" required>
<label for="a3">E-Mail</label><input id="a3" name="mail" type="email" data-expect="email" required>
<label for="a4">Telefon</label><input id="a4" name="telefon" type="tel" data-expect="phone">
<label for="a5">Straße</label><input id="a5" name="strasse" data-expect="street">
<label for="a6">PLZ</label><input id="a6" name="plz" data-expect="zip">
<label for="a7">Ort</label><input id="a7" name="ort" data-expect="city">
<label for="a8">Land</label><input id="a8" name="land" data-expect="country">
<label for="a9">Nachricht</label><textarea id="a9" name="nachricht" data-expect="notes"></textarea>
<label><input type="checkbox" id="a10" name="datenschutz" data-expect="consent"> Datenschutz akzeptieren</label>
</form></body></html>
