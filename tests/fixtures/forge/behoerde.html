<!doctype html><html lang="de"><body><h1>Antrag</h1><form id="amt">
<label for="b1">Familienname</label><input id="b1" name="familienname" data-expect="last_name" required>
<label for="b2">Vorname</label><input id="b2" name="vorname" data-expect="first_name" required>
<label for="b3">Geburtsdatum</label><input id="b3" name="geburtsdatum" type="date" data-expect="birthdate">
<label for="b4">Staatsangehörigkeit</label><input id="b4" name="staatsangehoerigkeit" data-expect="nationality">
<label for="b5">Passnummer</label><input id="b5" name="passnummer" data-expect="passport">
<label for="b6">Straße</label><input id="b6" name="strasse" data-expect="street">
<label for="b7">PLZ</label><input id="b7" name="plz" data-expect="zip">
<label for="b8">Ort</label><input id="b8" name="ort" data-expect="city">
<label for="b9">E-Mail</label><input id="b9" name="email" type="email" data-expect="email">
<label for="b10">Telefon</label><input id="b10" name="telefon" type="tel" data-expect="phone">
<label for="b11">Zweck</label><select id="b11" name="zweck" data-expect="purpose"><option value="">–</option><option>Arbeit</option><option>Studium</option></select>
<label><input type="checkbox" id="b12" name="einwilligung" data-expect="consent"> Einwilligung</label>
</form></body></html>
