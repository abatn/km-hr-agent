name: Security

# CodeQL (SAST) + Dependency-Audit + Secret-Scan. Läuft bei Push/PR + wöchentlich.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"   # montags

permissions:
  contents: read

jobs:
  # Hinweis: CodeQL/Code-Scanning setzt bei PRIVATEN Repos GitHub Advanced Security
  # (GHAS) voraus — sonst scheitert der SARIF-Upload mit „Resource not accessible by
  # integration" (belegt 04.10.2026). Deshalb hier Bandit (Python-SAINT) als
  # GHAS-freier SAST-Ersatz.
  bandit:
    name: SAST (Bandit, Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Bandit
        run: |
          python -m pip install --upgrade pip bandit
          # Nur hohe Schwere/Confidence blockieren; Rest reporten.
          bandit -r webui/ scripts/ connectors/ \
            -x '*/tests/*,*/__pycache__/*' -ll -q || echo "::warning::Bandit meldete Befunde"

  pip-audit:
    name: Dependency-Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          # Nur Produktiv-Dependencies prüfen; Befund reporten (nicht hart blockieren,
          # solange keine gepatchte Version verfügbar ist).
          pip-audit -r requirements.txt || echo "::warning::pip-audit meldete Befunde"

  gitleaks:
    name: Secret-Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
