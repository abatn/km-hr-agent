name: Deploy Contabo

# CD: nach grünem CI auf main -> SSH auf Contabo VPS -> git reset --hard -> App-Neustart.
# Spec: knowledge/system/deploy-pipeline.md (Quellen: GitHub-Doku Continuous deployment + workflow_run + secrets + REST deploy keys)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Ziel-Host des Deploys (20.10.2026: Umzug vom nicht erreichbaren Host
# 169.58.83.32 auf 176.57.189.201 — Spec knowledge/system/deploy-pipeline.md).
env:
  DEPLOY_HOST: 176.57.189.201

concurrency:
  group: deploy-contabo
  cancel-in-progress: false

jobs:
  deploy:
    name: Contabo VPS (pull + restart)
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: SSH-Key + known_hosts
        run: |
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/id_contabo
          chmod 600 ~/.ssh/id_contabo
          # 20.10.2026: harter Timeout (Default 5 s) + nicht-fatal. Ein Host mit
          # Netzaussetzer darf den Deploy nicht kippen - die SSH-Schritte nutzen
          # StrictHostKeyChecking=accept-new (Host-Key wird dort uebernommen).
          ssh-keyscan -H -T 30 "$DEPLOY_HOST" >> ~/.ssh/known_hosts \
            || echo "Hinweis: ssh-keyscan fehlgeschlagen (Host antwortet evtl. langsam) - accept-new uebernimmt den Host-Key"

      - name: Deploy (reset auf CI-SHA + restart + health)
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ssh -i "$HOME/.ssh/id_contabo" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            root@"$DEPLOY_HOST" "TARGET_SHA=${TARGET_SHA} bash -s" <<'EOF'
          set -e
          cd /opt/km-hr-agent
          echo "TARGET_SHA=$TARGET_SHA"
          git fetch origin main
          git reset --hard "$TARGET_SHA"
          git clean -fd
          if git diff --name-only HEAD@{1} HEAD -- requirements.txt | grep -q .; then
            echo "requirements.txt geaendert -> pip install"
            .venv-streamlit/bin/pip install -r requirements.txt -q
          else
            echo "requirements.txt unveraendert -> pip uebersprungen"
          fi

          # Cloudflare-Origin: Systemd-Unit (Loopback-Bindung) + Caddy-Site.
          if [ -f deploy/systemd/km-hr-agent.service ]; then
            install -m 644 deploy/systemd/km-hr-agent.service /etc/systemd/system/km-hr-agent.service
            systemctl daemon-reload
          fi
          if [ -f deploy/systemd/kmhr-social.service ] && [ -f deploy/systemd/kmhr-social.timer ]; then
            install -m 644 deploy/systemd/kmhr-social.service \
              deploy/systemd/kmhr-social.timer /etc/systemd/system/
            systemctl daemon-reload
            systemctl enable --now kmhr-social.timer
          fi
          if [ -f deploy/caddy/jobs.hanibal-ai.com.caddy ] && command -v caddy >/dev/null 2>&1; then
            install -d -m 755 /etc/caddy/conf.d
            install -m 644 deploy/caddy/jobs.hanibal-ai.com.caddy \
              /etc/caddy/conf.d/jobs.hanibal-ai.com.caddy
            grep -Fq 'import /etc/caddy/conf.d/*.caddy' /etc/caddy/Caddyfile \
              || echo 'import /etc/caddy/conf.d/*.caddy' >> /etc/caddy/Caddyfile
            caddy validate --config /etc/caddy/Caddyfile
            systemctl reload caddy
          fi

          systemctl restart km-hr-agent
          for i in $(seq 1 12); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then
              echo "health ok (try $i)"
              exit 0
            fi
            sleep 5
          done
          echo "HEALTH-FAIL nach 60s"
          journalctl -u km-hr-agent -n 40 --no-pager
          exit 1
          EOF

      - name: SHA-Abgleich (Server == GitHub)
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          SERVER_SHA=$(ssh -i "$HOME/.ssh/id_contabo" -o IdentitiesOnly=yes -o BatchMode=yes \
            root@"$DEPLOY_HOST" 'cd /opt/km-hr-agent && git rev-parse HEAD')
          echo "GitHub TARGET_SHA: $TARGET_SHA"
          echo "Server HEAD:       $SERVER_SHA"
          if [ "$SERVER_SHA" != "$TARGET_SHA" ]; then
            echo "SHA-MISMATCH"; exit 1
          fi
          echo "SHA-Abgleich OK"

      - name: Externer Cloudflare-Health-Check
        # Erst nach Caddy-Zertifikat/Proxy prüfen; 60 s Toleranz für ACME.
        run: |
          for i in $(seq 1 12); do
            if curl -fsSL --max-time 10 https://jobs.hanibal-ai.com/ >/dev/null 2>&1; then
              echo "externer Health-Check ok (try $i)"
              exit 0
            fi
            sleep 5
          done
          echo "EXTERNAL HEALTH FAIL"
          curl -sS -I --max-time 10 https://jobs.hanibal-ai.com/ || true
          exit 1
